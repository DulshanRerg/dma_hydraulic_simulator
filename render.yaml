# render.yaml — Render Blueprint for the EPANET / EPyT-Flow DMA simulator
# Docs: https://render.com/docs/blueprint-spec
#
# FREE-TIER VERSION: no persistent disk. Uploaded .gpkg files and the
# SQLite DB (data/db/epanet_service.db) will be wiped on every redeploy
# or restart. Re-upload your .gpkg data via POST /files/upload after
# each deploy if you use this config.
#
# Deploy: push this file (and the rest of the repo) to GitHub, then in the
# Render dashboard choose "New +" -> "Blueprint" and point it at the repo.

services:
  - type: web
    name: dma-hydraulic-simulator
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: API_KEYS
        sync: false        # set manually in the dashboard, don't commit real keys
      - key: GPKG_DIR
        value: /data/gpkg
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/db/epanet_service.db
      - key: SERVICE_NAME
        value: EPANET Hydraulic Service
      - key: DEBUG
        value: "false"